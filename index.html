<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Fábrica de Prompts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#050505;--sf:#101010;--sf2:#171717;--ln:#2a2418;--gold:#d4af37;--gold2:#f0d27a;--tx:#f5f3ee;--mu:#9a9690;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 50% at 50% 0,#1c1604,var(--bg) 65%) no-repeat var(--bg);color:var(--tx);font:15px/1.55 Manrope,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:20px 18px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600;letter-spacing:.01em}
h1{font-size:34px;line-height:1.08}h2{font-size:28px}h3{font-size:20px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;color:var(--gold)}
.brand i{width:30px;height:30px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px}
.sub{color:var(--mu);margin:10px 0 18px}
.badge{display:inline-block;border:1px solid var(--ln);background:var(--sf);color:var(--gold2);border-radius:99px;padding:4px 12px;font-size:12px;margin-bottom:14px}
textarea,input,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;color:var(--tx);font:inherit;padding:14px;outline:none}
textarea{min-height:150px;resize:vertical;font-size:16px}
textarea:focus,input:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
.lab{font-family:"Cormorant Garamond",serif;font-size:21px;margin:18px 0 8px}
.btn{display:block;width:100%;min-height:54px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(110deg,#b8912b 0%,#e8c65a 35%,#f6dd8e 50%,#e8c65a 65%,#b8912b 100%);background-size:220% 100%;animation:shine 5s ease-in-out infinite;color:#120e02;font:700 15px Manrope,sans-serif;letter-spacing:.06em;cursor:pointer;margin-top:16px}
.btn.o{background:transparent;animation:none;color:var(--gold2)}
.btn:active{transform:scale(.98)}
.hint{font-size:13px;color:var(--mu);margin-top:10px}
details{margin-top:14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--gold2);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cats{display:grid;gap:10px;margin-top:6px}
.cat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:15px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:12px;width:100%}
.cat:hover,.cat.on{border-color:var(--gold)}
.cat b{display:block;font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--gold2)}
.cat span{color:var(--mu);font-size:13px}
.cat em{font-style:normal;color:var(--gold);font-size:24px;line-height:1.1}
.cat{transition:transform .2s,border-color .2s}.cat:hover{transform:translateY(-2px)}.cat:active{transform:scale(.98)}.tiles{grid-template-columns:1fr 1fr}.tiles .cat{grid-template-columns:1fr;gap:6px;padding:14px}.tiles .cat span{font-size:12px;line-height:1.35}.tiles .cat:last-child{grid-column:1/-1}
.out{background:var(--sf);border:1px solid var(--gold);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.65;margin-top:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:10px}
.item p{margin:8px 0;color:#d8d5ce;font-size:13.5px;max-height:4.6em;overflow:hidden}
.item small{color:var(--gold)}
.item .row{margin-top:6px}.item .btn{min-height:44px;margin-top:0;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--mu);font:600 14px Manrope,sans-serif;cursor:pointer}
.seg .on{background:#1f1a0c;color:var(--gold2)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,8,.96);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;color:var(--mu);font:500 10.5px Manrope,sans-serif;min-height:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav .on{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#120e02;font-weight:700;padding:10px 18px;border-radius:99px;z-index:20}
.empty{border:1px dashed var(--ln);border-radius:14px;padding:26px;text-align:center;color:var(--mu);margin-top:12px}
code{background:var(--sf2);padding:2px 6px;border-radius:6px;color:var(--gold2);font-size:13px}
@media (prefers-reduced-motion:no-preference){.out{animation:in .35s ease}@keyframes in{from{opacity:0}to{opacity:1}}#app>*{animation:rise .5s ease both}.cat{animation:rise .55s ease both}.cats .cat:nth-child(2){animation-delay:.05s}.cats .cat:nth-child(3){animation-delay:.1s}.cats .cat:nth-child(4){animation-delay:.15s}.cats .cat:nth-child(5){animation-delay:.2s}.cats .cat:nth-child(6){animation-delay:.25s}.cats .cat:nth-child(7){animation-delay:.3s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}.brand i{animation:glow 3s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 14px rgba(212,175,55,.55)}}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<script>
/* Endereço do seu servidor de IA (opcional). Recebe POST JSON {instrucao, ideia, modo} e devolve {prompt}. Sem endereço, o app usa o modo básico. */
var CONFIG = { endpoint: "" };

var CATS = [
 ["modelos","◇","Modelos ultra-realistas","Pessoas fictícias com pele, cabelo, expressão e roupas detalhados.","retrato natural, sem retoque aparente"],
 ["lifestyle","☼","Lifestyle e selfies","Fotos espontâneas: viagens, restaurantes, academia, praia e rotina.","foto espontânea tirada com celular"],
 ["produtos","❖","Divulgação de produtos","Modelos apresentando roupas, cosméticos, acessórios e eletrônicos.","foto comercial natural, produto bem visível"],
 ["lojas","⌂","Lojas e comércios","Modelos divulgando lojas, salões, barbearias, farmácias e restaurantes.","foto de divulgação no próprio local do negócio"],
 ["profissional","◉","Fotos profissionais","Estúdio, ensaios, retratos e imagens comerciais.","fotografia de estúdio com fundo limpo"],
 ["videos","▶","Criação de vídeos","Prompts para vídeos com movimentos, falas, expressões, gestos e cenas.","vídeo vertical gravado com celular"],
 ["influencers","✦","Influencers digitais","Personagens fictícios com aparência e identidade consistentes.","foto de perfil de criadora de conteúdo, identidade visual consistente"]
];
var ENVS = [
 [/loja de roupas|boutique|arara/,"interior de uma loja de roupas real: araras com peças penduradas, espelho de corpo inteiro, piso claro e vitrine levemente desfocada ao fundo"],
 [/salão|cabeleir/,"interior de um salão de beleza: bancada com espelho, cadeiras, produtos nas prateleiras e luz do teto misturada à luz da rua"],
 [/barbearia|barbeiro/,"interior de uma barbearia: cadeira de barbeiro, espelhos, ferramentas organizadas na bancada e madeira escura nas paredes"],
 [/farmácia/,"interior de uma farmácia: gôndolas com produtos, balcão de atendimento e iluminação branca de teto"],
 [/restaurante|café|cafeteria/,"mesa de um restaurante: pratos e copos sobre a mesa, outras pessoas desfocadas ao fundo e luz quente de ambiente"],
 [/academia|treino/,"academia: aparelhos e halteres ao fundo, espelho grande e iluminação de teto fria"],
 [/praia|mar/,"praia: areia, mar ao fundo, céu aberto e luz natural intensa com sombras duras suavizadas"],
 [/viagem|passeio|rua|cidade/,"rua de uma cidade em dia comum: calçada, fachadas, pessoas desfocadas e luz natural do céu"],
 [/estúdio/,"estúdio fotográfico com fundo neutro liso e luz controlada, sem excesso de efeitos"],
 [/casa|sala|quarto|cozinha/,"ambiente doméstico real: móveis do dia a dia, pequenos objetos pessoais e luz natural vinda da janela"]
];
var CAMS = ["celular moderno (lente principal, equivalente a 26 mm), na altura dos olhos, leve inclinação natural","câmera mirrorless com lente 50 mm f/1.8, ligeiramente abaixo da linha dos olhos","câmera com lente 35 mm f/2, enquadramento levemente lateral, sem simetria perfeita"];
var LUZ = ["luz natural suave e coerente com o ambiente, sombras macias sem recorte artificial","luz difusa lateral vinda de janela ou vitrine, contraste natural e leve queda de luz no lado oposto","luz ambiente do local combinada com luz indireta natural, sem flash e sem luz de estúdio"];
var POSES = ["postura relaxada, peso do corpo levemente apoiado em uma perna, ombros soltos","corpo ligeiramente girado em três quartos, uma mão em movimento natural","postura ereta e confortável, cabeça levemente inclinada, gesto espontâneo"];
var EXPR = ["expressão tranquila com sorriso leve e assimétrico, olhar direto para a câmera","sorriso discreto de quem acabou de falar algo, olhar levemente desviado para o lado","expressão simpática e natural, olhar para a lente com sobrancelhas relaxadas"];
var REFORCOS = ["Pele com poros visíveis, pequenas linhas de expressão e variação natural de tom, sem suavização digital.","Fios de cabelo soltos, frizz sutil e mechas fora do lugar, sem penteado perfeito de salão.","Roupa com micro dobras e caimento real do tecido, sem aspecto de manequim ou renderização."];
var EVITAR = "pele de plástico, efeito de boneca, brilho excessivo, filtros, saturação exagerada, contraste artificial, aparência de cinema, cabelo perfeito demais, sorriso artificial, mãos deformadas, texto ilegível";

var S = {view:"home",mode:"imagem",cat:"modelos",idea:"",opts:{},res:null,ver:0,lvl:0,lib:[],filter:"todas",busy:false,human:true,img:null};
try{S.lib=JSON.parse(localStorage.getItem("fm_lib")||"[]")}catch(e){S.lib=[]}
function saveLib(){try{localStorage.setItem("fm_lib",JSON.stringify(S.lib))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function catName(id){var c=CATS.filter(function(x){return x[0]===id})[0];return c?c[2]:id}

/* ===== MOTOR DEMONSTRATIVO (substituído pelo backend quando CONFIG.endpoint existir) ===== */
function demo(p){
 var t=p.ideia.toLowerCase(),o=p.opcoes,v=p.versao%3,cat=CATS.filter(function(c){return c[0]===p.categoria})[0]||CATS[0];
 var masc=/homem|rapaz|barbeiro/.test(t),fem=/mulher|garota|menina|modelo|moça/.test(t)&&!masc;
 var suj=o.genero==="Homem"?"homem":o.genero==="Mulher"?"mulher":masc?"homem":fem?"mulher":"pessoa";
 var m=t.match(/(\d{2})\s*anos/),idade=o.idade||(m?m[1]:"");
 var env="",et=(o.ambiente||"").toLowerCase()||t;for(var i=0;i<ENVS.length;i++){if(ENVS[i][0].test(et)){env=ENVS[i][1];break}}if(!env)env=o.ambiente||"";
 var L=[];
 L.push((p.modo==="video"?"Vídeo realista, gravado como se fosse com celular, de ":"Fotografia realista de ")+(suj==="homem"?"um ":"uma ")+suj+(idade?" de "+idade+" anos":" adulta")+(o.nacionalidade?", "+o.nacionalidade:"")+": "+p.ideia.replace(/\.$/,"")+".");
 L.push("ESTILO: "+(o.estilo||cat[4])+".");
 L.push("PERSONAGEM: rosto com proporções naturais e leve assimetria; "+(o.pele?"pele "+o.pele+" ":"pele ")+"com textura real, poros visíveis, pequenas linhas e imperfeições sutis, sem brilho excessivo; "+(o.cabelo||o.corcabelo?"cabelo "+(o.cabelo||"")+" "+(o.corcabelo||"")+", ":"cabelo natural, ")+"com fios individuais e alguns fios soltos"+(o.olhos?"; olhos "+o.olhos:"")+(o.altura||o.peso?"; corpo com "+[o.altura&&"altura de "+o.altura,o.peso&&"peso de cerca de "+o.peso].filter(Boolean).join(" e "):"")+(o.sardas==="com sardas"?"; sardas naturais espalhadas pelo rosto":"")+".");
 L.push("EXPRESSÃO E POSTURA: "+(EXPRM[o.expressao]||EXPR[v])+"; "+POSES[v]+".");
 L.push("ROUPAS E ACESSÓRIOS: "+(o.roupa?o.roupa+", com caimento real do tecido":"peças coerentes com a ideia e com o ambiente, com caimento real do tecido e pequenas dobras naturais")+(o.acessorios&&o.acessorios!=="sem acessórios"?"; usando "+o.acessorios:"")+".");
 L.push("CENÁRIO: "+(env||"ambiente coerente com a ideia, com objetos reais e discretos ao fundo, sem poluição visual")+".");
 L.push("CÂMERA: "+(TF[o.tipofoto]||o.camera||CAMS[v])+(o.angulo?"; ângulo "+o.angulo:"")+"; enquadramento "+(o.enquadramento||"médio, da cintura para cima, com espaço de respiro")+"; fundo com profundidade de campo natural.");
 L.push("ILUMINAÇÃO: "+(o.iluminacao||LUZ[v])+".");
 if(p.modo==="video"){
  var x=o.tipovideo?o.tipovideo+(o.subvideo?" - "+o.subvideo:"")+(o.acao?"; "+o.acao:""):(o.acao||"a pessoa realiza a ação descrita na ideia de forma natural, sem pressa");
  L.push("AÇÃO: "+x+".");if(o.tipovideo==="Motion control")L.push("MOTION CONTROL: replicar fielmente os movimentos, os gestos e o ritmo do vídeo de referência, mantendo a aparência do personagem descrito e sem alterar a velocidade.");
  L.push("MOVIMENTO CORPORAL E EXPRESSÕES: gestos pequenos e fluidos, respiração visível, piscadas naturais, sem movimentos robóticos ou exagerados; a expressão muda aos poucos conforme a fala.");
  L.push("MOVIMENTO DE CÂMERA: "+(o.movcam||"câmera na mão com leve oscilação natural, sem zoom brusco")+".");
  L.push("DIÁLOGO (português brasileiro): "+(o.fala?"“"+o.fala+"”":"fala curta, informal e natural, no tom de quem conversa com um amigo")+"; sincronização labial precisa, voz coerente com a idade e a aparência.");
  L.push("DURAÇÃO: "+(o.duracao||"8 segundos")+", formato "+(o.formato||"9:16 (vertical)")+(o.destino?", para o "+o.destino:"")+". CONTINUIDADE: mesmo rosto, cabelo, roupa e cenário do início ao fim, sem trocas entre os cortes.");
 }
 L.push("QUALIDADE: aparência de foto feita por "+(/celular|iPhone|Galaxy/.test(o.qualidade||o.camera||"")||!o.qualidade&&!o.camera&&v===0?"celular":"câmera")+" real, nitidez natural e leve grão, cores fiéis, sem aparência cinematográfica nem pós-produção pesada.");
 if(p.nivel>0)for(var k=0;k<Math.min(p.nivel,3);k++)L.push("REFORÇO "+(k+1)+": "+REFORCOS[k]);
 L.push("EVITAR: "+EVITAR+".");
 return L.join("\n\n");
}
var DEFSUF="";
function getSuf(){try{var s=localStorage.getItem("fm_suf");return s===null?DEFSUF:s}catch(e){return DEFSUF}}
async function gerar(p){
 if(CONFIG.endpoint){try{
  var ins="Você é especialista em prompts de "+(p.modo==="video"?"vídeo":"imagem")+" para o Gemini. Transforme a ideia abaixo em UM prompt em português do Brasil, pronto para copiar e colar. Preserve a ideia original e acrescente só detalhes que melhorem o resultado e sejam coerentes com ela: idade aparente, rosto, pele com poros e imperfeições naturais, cabelo com fios individuais, expressão, olhar, postura, roupas, ambiente, objetos, câmera, enquadramento, luz natural, sombras, profundidade de campo. Realismo de foto feita com celular real: sem pele artificial, sem efeito de boneca, sem brilho excessivo, sem filtros, sem estética de cinema. Não invente traços que contradigam a ideia. Sem enrolação e sem palavras repetidas. Organize em parágrafos curtos com rótulos em maiúsculas."+(p.modo==="video"?" Inclua ação, movimento corporal natural, expressões, movimento de câmera, diálogo em português brasileiro, sincronização labial, duração e continuidade visual.":"")+" Responda somente com o prompt, sem explicações e sem aspas ao redor.\n\nCATEGORIA: "+catName(p.categoria)+"\nIDEIA: "+p.ideia+"\nOPÇÕES ESCOLHIDAS: "+JSON.stringify(p.opcoes)+"\nVERSÃO: "+(p.versao+1)+(p.versao>0?" (use uma interpretação diferente das anteriores, mantendo a ideia)":"")+(p.base?"\n\nPROMPT ATUAL, para enriquecer sem perder a ideia:\n"+p.base:"");
  var rs=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({instrucao:ins,ideia:p.ideia,modo:p.modo})});
  if(rs.ok){var d=await rs.json();if(d&&d.prompt&&d.prompt.trim())return {prompt:d.prompt.trim(),demo:false}}
 }catch(e){}}
 await new Promise(function(r){setTimeout(r,450)});
 return {prompt:demo(p),demo:true};
}

/* ===== INTERFACE ===== */
var NAV=[["home","⌂","Início"],["imagem","▣","Imagem"],["video","▶","Vídeo"],["cats","❖","Categorias"],["lib","♡","Biblioteca"],["perfil","◔","Perfil"]];
var OPT={idade:["20","25","30","35","40","50","60"],nacionalidade:["brasileira","latina","europeia","americana","asiática","africana"],cabelo:["cacheado","cacheado volumoso","liso","liso longo","liso curto","ondulado","crespo","chanel","com franja","preso em coque","rabo de cavalo","trança","raspado","calvo"],corcabelo:["preto","castanho escuro","castanho claro","loiro","loiro escuro","ruivo","grisalho","branco","com mechas","colorido"],pele:["branca","clara","morena clara","morena","parda","negra","negra retinta","oriental","bronzeada"],altura:["1,55 m","1,60 m","1,65 m","1,70 m","1,75 m","1,80 m","1,85 m"],peso:["50 kg","55 kg","60 kg","65 kg","70 kg","80 kg","90 kg","100 kg"],sardas:["com sardas","sem sardas"],genero:["Mulher","Homem"],acessorios:["brincos","colar","brincos e colar","óculos de sol","relógio","pulseira","anel","boné","sem acessórios"],expressao:["Sorrindo","Sorriso leve","Sério","Olhar sereno","Rindo"],tipofoto:["Selfie","Selfie no espelho","Foto tirada por outra pessoa","Foto de corpo inteiro tirada por outra pessoa"],angulo:["na altura dos olhos","de cima para baixo","de baixo para cima","de lado (perfil)","três quartos"],qualidade:["iPhone 15","iPhone 16","iPhone 17","iPhone 18","Samsung Galaxy S25","Câmera DSLR"],olhos:["castanhos","castanho claro","verdes","azuis","pretos","cor de mel","avelã","cinza"],roupa:["vestido","vestido longo","vestido curto","jeans e camiseta","conjunto casual","conjunto de moletom","blusa e saia","macacão","roupa social","camisa social","terno","roupa de academia","biquíni","saída de praia","jaleco","avental","uniforme do comércio"],ambiente:["Loja de roupas","Salão de beleza","Barbearia","Farmácia","Restaurante","Academia","Praia","Rua da cidade","Estúdio","Dentro de casa"],estilo:["foto espontânea de celular","retrato natural","foto comercial natural","estúdio profissional"],camera:["celular moderno","câmera mirrorless 50 mm","câmera 35 mm"],enquadramento:["close no rosto","médio, da cintura para cima","corpo inteiro"],iluminacao:["luz natural de janela","luz do próprio ambiente","luz suave de fim de tarde"],acao:["mostra o produto para a câmera","caminha em direção à câmera","fala olhando para a câmera","gira mostrando a roupa"],duracao:["5 segundos","10 segundos","15 segundos"],destino:["Flow","Gemini"],formato:["9:16 (vertical)","1:1 (quadrado)"],tipovideo:["Motion control","Divulgação de produto","Dança de TikTok","Lifestyle"],movcam:["câmera na mão com leve oscilação","câmera parada no tripé","aproximação lenta"]};

 else if(a==="ldel"){S.lib=S.lib.filter(function(i){return i.id!==v});saveLib();render()}

 else if(a==="tip"){S.tip=(S.tip+1)%TIPS.length;render()}
 else if(a==="savename"){saveName()}
 else if(a==="idea"){ideia()}
 else if(a==="rmimg"){S.img=null;render()}
 else if(a==="sufsave"){try{localStorage.setItem("fm_suf",document.getElementById("suf").value.trim())}catch(e){}toast("Salvo")}
 else if(a==="clear"){if(S.lib.length&&confirm("Apagar todos os prompts salvos?")){S.lib=[];saveLib();toast("Biblioteca apagada")}}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lg_pass")doLogin();if(e.key==="Enter"&&e.target.id==="nm")saveName()});
document.addEventListener("change",function(e){if(e.target.id==="o_tipovideo"){readForm();S.opts.subvideo="";render();return}if(e.target.id==="o_img"){readForm();S.img=e.target.files[0]||null;render()}});
render();
</script>
